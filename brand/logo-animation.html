const NS='http://www.w3.org/2000/svg', VBW=6206, VBH=1520;
const BIG={w:1180,cx:1280,cy:720}, TOP={h:56,x:32,y:68}, ENDC={w:1040,cx:1280,cy:720};
const DX=3093-750, R=5480;
let bars=[], letters=[], mG=[], tG=[];
const cl=v=>Math.max(0,Math.min(1,v)), ss=p=>p*p*(3-2*p), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function xfBig(){const s=BIG.w/VBW;return {s,x:BIG.cx-BIG.w/2+10*s,y:BIG.cy-VBH*s/2+10*s};}
function xfTop(){const s=TOP.h/VBH;return {s,x:TOP.x+10*s,y:TOP.y+10*s};}
function xfEnd(){const s=ENDC.w/VBW;return {s,x:ENDC.cx-ENDC.w/2+10*s,y:ENDC.cy-VBH*s/2+10*s};}
function setXf(a){document.getElementById('logo').setAttribute('transform',`translate(${a.x} ${a.y}) scale(${a.s})`);}
async function init(){
  const doc=new DOMParser().parseFromString(LOGO_SVG,'image/svg+xml');
  const mark=document.getElementById('mark'), word=document.getElementById('word'), mg=document.getElementById('mg'), tg=document.getElementById('tg');
  const G=(par,arr,d,delay,dur)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','gd');p.setAttribute('pathLength','1');p.setAttribute('stroke-dasharray','1 1');par.appendChild(p);arr.push({el:p,delay,dur});};
  G(mg,mG,'M1500 750A750 750 0 1 0 0 750A750 750 0 1 0 1500 750',0,1.3);
  G(mg,mG,'M750 -170V1670',.25,.8);G(mg,mG,'M-170 750H1670',.35,.8);
  G(mg,mG,'M0 -170V1670',.5,.8);G(mg,mG,'M1500 -170V1670',.6,.8);G(mg,mG,'M-170 0H1670',.7,.8);G(mg,mG,'M-170 1500H1670',.8,.8);
  G(tg,tG,'M1500 0H6500',0,1.0);G(tg,tG,'M1500 750H6500',.12,1.0);G(tg,tG,'M1500 1500H6500',.24,1.0);
  G(tg,tG,'M1570 -200V1700',.3,.8);G(tg,tG,'M6186 -200V1700',.45,.8);
  for(let x=1570;x<=6186;x+=461.6) G(tg,tG,`M${x} 1500v70`,.5+(x-1570)/9000,.3);
  doc.querySelectorAll('.bw-spin rect').forEach(r=>{const c=r.cloneNode();c.setAttribute('transform','translate(750 750) '+r.getAttribute('transform'));c.setAttribute('class','pc');c.setAttribute('pathLength','1');c.setAttribute('stroke-dasharray','1 1');mark.appendChild(c);bars.push(c);});
  ['.bw-brand','.bw-werx'].forEach(sel=>{
    const subs=doc.querySelector(sel).getAttribute('d').split(/(?=M)/).map(s=>s.trim()).filter(Boolean);
    const tmp=subs.map(s=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',s);word.appendChild(p);const b=p.getBBox();word.removeChild(p);return {s,b};});
    tmp.sort((a,b)=>a.b.x-b.b.x); const groups=[];
    tmp.forEach(t=>{const g=groups[groups.length-1];
      if(g && t.b.x<g.x1-20){g.s.push(t.s);g.x1=Math.max(g.x1,t.b.x+t.b.width);} else groups.push({s:[t.s],x0:t.b.x,x1:t.b.x+t.b.width});});
    groups.forEach(g=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',g.s.join(' '));p.setAttribute('class','pc');p.setAttribute('pathLength','1');p.setAttribute('stroke-dasharray','1 1');word.appendChild(p);letters.push({el:p,x:g.x0});});
  });
  letters.sort((a,b)=>a.x-b.x);
  await document.fonts.ready; render(0); return bars.length+letters.length;
}
function piece(el,draw,fill,k){
  el.setAttribute('stroke-dashoffset',(1-draw).toFixed(4));
  el.style.strokeOpacity=(draw>0?0.62*(1-fill):0).toFixed(3);
  const v=k*fill; el.style.fill=v<=0.004?'none':`rgb(${Math.round(242*v)},${Math.round(239*v)},${Math.round(232*v)})`;
}
function guides(arr,drawFn,op){arr.forEach(g=>{const a=drawFn(g);g.el.setAttribute('stroke-dashoffset',(1-a).toFixed(4));g.el.style.strokeOpacity=op.toFixed(3);g.el.style.opacity=(a>0&&op>0)?1:0;});}
const spring=(t,w,z)=>{if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));};
function lockup(slide,spin){ // slide 0 = star alone centered, 1 = full lockup
  const mx=DX*(1-slide), rel=-R*(1-slide);
  document.getElementById('mark').setAttribute('transform',`translate(${mx} 0) rotate(${spin||0} 750 750)`);
  document.getElementById('word').setAttribute('transform',`translate(${mx+rel} 0)`);
  document.getElementById('wcr').setAttribute('x',slide>=1?-99999:mx+750);
  document.getElementById('tg').setAttribute('transform','translate(0 0)');
}
const T1=27.2333, REV=T1-4.75;
function render(t){
  document.getElementById('grid').style.opacity=cl(t/0.8);
  const L=document.getElementById('logo'); L.style.opacity=1;
  if(t>=T1-0.05){ // small solid logo, top-left
    setXf(xfTop()); lockup(1); bars.forEach(b=>piece(b,1,1,1)); letters.forEach(l=>piece(l.el,1,1,1));
    guides(mG,()=>0,0); guides(tG,()=>0,0); L.style.opacity=ss(cl((t-T1)/0.5)); return; }
  setXf(xfBig());
  if(t<REV){
    const slide=spring(t-4.3,7.5,0.72); const spin=360*spring(t-8.7,11,0.7); lockup(slide,spin);
    const k=1, mFill=ss(cl((t-3.0)/0.8));
    bars.forEach((b,i)=>piece(b,ss(cl((t-0.8-i*0.3)/1.4)),mFill,k));
    guides(mG,g=>ss(cl((t-0.5-g.delay)/g.dur)),0.34*(1-ss(cl((t-3.3)/0.9))));
    letters.forEach((l,i)=>piece(l.el,slide>0?1:0,ss(cl((t-7.0-i*0.06)/0.7)),k));
    guides(tG,g=>ss(cl((t-5.9-g.delay)/g.dur)),0.34*(1-ss(cl((t-7.8)/0.9))));
  } else {
    const r=t-REV, k=1, n=letters.length;
    const slide=1-io(cl((r-0.9)/1.3)); lockup(slide);
    letters.forEach((l,i)=>piece(l.el,slide>0?1:0,1-ss(cl((r-(n-1-i)*0.04)/0.55)),k));
    guides(tG,()=>0,0);
    const mFill=1-ss(cl((r-2.3)/0.6));
    bars.forEach((b,i)=>piece(b,1-ss(cl((r-2.95-(2-i)*0.2)/0.9)),mFill,k));
    guides(mG,g=>1-ss(cl((r-2.9-(0.8-g.delay)*0.5)/0.8)),0.3*ss(cl((r-2.3)/0.5)));
  }
}
function renderEnd(u){ // u seconds after the panels start fading
  const a=xfTop(), b=xfEnd(), p=io(cl((u-0.3)/1.2));
  setXf({s:a.s+(b.s-a.s)*p,x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p}); lockup(1);
  document.getElementById('logo').style.opacity=1;
  document.getElementById('grid').style.opacity=1-ss(cl((u-2.4)/1.2));
  const n=letters.length;
  bars.forEach((el,i)=>piece(el,1-ss(cl((u-2.55-i*0.05)/0.9)),1-ss(cl((u-1.8-i*0.03)/0.6)),1));
  letters.forEach((l,i)=>piece(l.el,1-ss(cl((u-2.7-i*0.045)/0.9)),1-ss(cl((u-1.9-i*0.03)/0.6)),1));
  guides(mG,()=>0,0); guides(tG,()=>0,0);
}
// play on a loop
init().then(()=>{ const t0=performance.now(); const LOOP=T1-0.2;
  (function frame(){ render(((performance.now()-t0)/1000)%LOOP); requestAnimationFrame(frame); })(); });
